<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yile Wang Lab · Publications</title>
<meta name="description" content="王毅乐课题组已发表与已录用论文列表：标题即原文链接，附 DOI、录用证明与期刊横幅。">
<link rel="canonical" href="https://yilewang-lab.github.io/publications.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1a33'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Georgia,serif' font-weight='700' fill='%23ddbe5f' text-anchor='middle'%3EYW%3C/text%3E%3C/svg%3E">

<style>
/* ============================================================================
 *  版式：经典学术主页样式（灰底 + 白色圆角卡片 + 左侧缩略图 + 粗体深蓝标题即链接）
 *  尺寸与配色按参考站点实测值还原：正文 Arial 16px、卡片 750px + 20px 内边距、
 *  圆角 10px、链接 #0050e7、论文标题 #0000A0 加粗、缩略图 200px。
 * ==========================================================================*/

@media screen and (max-device-width: 480px) {
  body { -webkit-text-size-adjust: none; }
}

body {
  margin: 0; padding: 0;
  font-family: Arial, "Helvetica Neue", Helvetica, "Microsoft YaHei", sans-serif;
  font-size: 16px;
  background-color: rgb(224, 224, 224);
  color: #000;
}

p { font-size: 16px; }
h2 { font-size: 20px; margin: 0; padding: 0; }
h3 { font-size: 18px; margin: 8px 0 0; padding: 0; }

.container {
  width: 750px;
  margin: 20px auto;
  border-radius: 10px;
  background-color: #fff;
  padding: 20px;
}

a { text-decoration: none; }
a:hover { text-decoration: underline; }
a, a:visited { color: #0050e7; }

/* ---- 导航卡片 ---- */
.nav-card h2 { font-weight: 700; line-height: 1.6; }

/* ---- 年份标题 ---- */
#pub-list h3 { margin-top: 6px; }

/* ---- 论文条目：左缩略图 + 右文字块 ---- */
.publication {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  padding: 0 0 30px;
}
.pub-thumb { flex: 0 0 200px; width: 200px; }
.pub-thumb img { width: 200px; height: auto; display: block; border: 0; }

/* 没有论文配图时，用「期刊简称 + 年份」的方块占位，宽度与缩略图一致 */
.pub-thumb--tile {
  width: 200px;
  height: 122px;
  box-sizing: border-box;
  border: 1px solid #d5d5d5;
  border-radius: 4px;
  background: #f5f5f5;
  color: #555;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-align: center;
  padding: 6px;
}
.pub-thumb--tile b { font-size: 15px; color: #333; }
.pub-thumb--tile span { font-size: 13px; color: #888; }

.pub-body { flex: 1 1 auto; min-width: 0; }

.pub-title { font-weight: 700; }
.pub-title a { color: #0000A0; }

.pub-title-zh {
  display: block;
  margin-top: 3px;
  font-size: 14px;
  font-weight: 400;
  color: #666;
  line-height: 1.5;
}

.pub-authors { margin: 14px 0 0; line-height: 1.45; }
.pub-venue { margin: 0; font-style: italic; line-height: 1.45; }
.pub-note { margin: 0; font-size: 12px; color: #777; line-height: 1.45; }

.publication .links { display: block; margin-top: 14px; }
.publication .links a { margin-right: 20px; }

/* ---- 窄屏适配：缩略图改为在上方（桌面端外观不受影响） ---- */
@media (max-width: 820px) {
  .container { width: auto; margin: 12px; padding: 16px; }
  .publication { display: block; padding-bottom: 24px; }
  .pub-thumb { width: 150px; margin-bottom: 10px; }
  .pub-thumb img { width: 150px; }
  .pub-thumb--tile { width: 150px; height: 96px; }
}
</style>
</head>

<body>

<!-- ==================================================== 导航 -->
<div class="container nav-card">
  <h2>
    <a href="./">Home</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a href="./#research">Research</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a href="publications.html">Publications</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a href="./#team">Team</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a href="./#data">Data &amp; Code</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a href="./#links">Links</a>&nbsp;&nbsp;&middot;&nbsp;&nbsp;<a href="./#contact">Contact</a>
  </h2>
</div>

<!-- ==================================================== 论文列表 -->
<div class="container">
  <h2>Publications</h2>
  <br>
  <div id="pub-list"></div>

  <noscript>
    <p>列表需要 JavaScript 才能显示。你可以直接前往
      <a href="https://github.com/YileWang-Lab/YileWang-Lab.github.io/blob/main/data/publications.js">publications.js</a>
      查看全部条目。</p>
  </noscript>
</div>

<script src="data/publications.js"></script>
<script src="assets/js/publications-page.js"></script>
</body>
</html>
